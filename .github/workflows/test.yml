name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          locked: true
      - name: OpenAPI lint (doc/openapi.yaml)
        run: pixi run lint-api
      - name: Unit tests (ASan/UBSan)
        run: pixi run test
      - name: Static analysis (gcc -fanalyzer, vs baseline)
        run: pixi run analyze
      - name: cppcheck (informational until triaged)
        continue-on-error: true
        run: pixi run cppcheck --enable=warning,portability --inline-suppr --suppress='*:src/lib/*' --error-exitcode=1 src

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build libFuzzer harnesses (clang)
        run: make -C tests/fuzz build
      - name: HTTP parser fuzz smoke (bounded)
        run: FUZZ_SECS=45 make -C tests/fuzz smoke-http
      - name: RTSP parser fuzz smoke (bounded)
        # Reproduces the #34 SETUP track-id OOB on the unhardened parser in
        # seconds; runs clean against the hardened rtsp.c. Flip to blocking
        # (drop continue-on-error) once fix/rtsp-control-robust lands on master.
        continue-on-error: true
        run: FUZZ_SECS=45 make -C tests/fuzz smoke-rtsp
